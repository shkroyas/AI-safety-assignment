# Every threshold, model name and routing rule lives here (CLAUDE.md rule).
# Env vars override llm.provider / llm.model / llm.region: HOSTED_PROVIDER, HOSTED_MODEL, BEDROCK_REGION.

llm:
  provider: mock                         # mock | bedrock
  model: us.anthropic.claude-opus-4-6-v1
  region: us-east-1
  max_tokens: 2048
  timeout_s: 60
  max_retries: 2
  structured_output: true             # output_config.format with the SupportReply JSON schema

retriever:
  top_k: 4
  embedder: hashing                      # hashing (fast, CI) | sentence-transformers
  embedding_model: BAAI/bge-small-en-v1.5
  hashing_dim: 4096

corpus:
  path: data/corpus

audit:
  path: logs/audit.jsonl

rag:
  chunk_scan:
    tau: 0.8                   # drop a chunk when max(pattern weight, classifier score) >= tau
    classifier: stub           # stub | deberta | prompt_guard. Stub on purpose: DeBERTa scores 7/117 clean
                               # chunks >= 0.999 (poisoned = 1.0), so no tau separates them (ml-input spec)
    allowed_domains: [sagarmatha-digital.example]   # filled into {allowed} below
    # Chunk-only patterns, added after the input injection bank. Too strict for user input,
    # safe on bank-authored policy text. Case-insensitive, run on normalized chunk text.
    extra_patterns:
      EXTERNAL_EXFIL:
        regex: '\b(?:send|forward|e-?mail|mail)\w*\b[^.\n]{0,60}?\bto\s+[\w.+-]+@(?!(?:{allowed})\b)[\w-]+(?:\.[\w-]+)+'
        weight: 1.0
      CREDENTIAL_REQUEST:
        regex: '\bcvv\b[^.\n]{0,40}\b(?:chat|send|pathau\w*)\b'
        weight: 1.0

# Guardrail sections are filled in by the feature branches that implement them.
input:
  normalizer:
    decode:
      min_len: 16          # shortest base64/hex token considered for decoding
      min_printable: 0.9   # fraction of decoded chars that must be printable
    homoglyphs:            # look-alike -> Latin (Cyrillic, Greek)
      "а": "a"
      "в": "b"
      "е": "e"
      "к": "k"
      "м": "m"
      "н": "h"
      "о": "o"
      "р": "p"
      "с": "c"
      "т": "t"
      "у": "y"
      "х": "x"
      "і": "i"
      "ј": "j"
      "ѕ": "s"
      "А": "A"
      "В": "B"
      "Е": "E"
      "К": "K"
      "М": "M"
      "Н": "H"
      "О": "O"
      "Р": "P"
      "С": "C"
      "Т": "T"
      "Х": "X"
      "І": "I"
      "α": "a"
      "ε": "e"
      "ι": "i"
      "ο": "o"
      "ρ": "p"
      "υ": "u"
      "Α": "A"
      "Β": "B"
      "Ε": "E"
      "Ι": "I"
      "Κ": "K"
      "Μ": "M"
      "Ν": "N"
      "Ο": "O"
      "Ρ": "P"
      "Τ": "T"
      "Χ": "X"
  pii:
    backend: stub              # stub | presidio (`pii` extra) | gliner (`ml` extra)
    gliner:                    # names and places only; regex recognizers cover the rest
      name: urchade/gliner_multi_pii-v1
      threshold: 0.5
      labels: {person: PERSON, location: LOCATION}   # GLiNER label -> our label
      # Whole-span matches dropped: GLiNER scores "I" as a person at 0.96 at sentence start.
      ignore: [i, me, my, mine, myself, you, your, yours, we, us, our, he, him, his, she, her, they, them, their, it]
      device: auto             # auto (cuda if available) | cpu | cuda
    spacy_model: en_core_web_sm
    # Order = priority when two equal-length spans overlap.
    labels: [CARD, NP_CITIZENSHIP, NP_PAN, ACCOUNT_NO, NP_PHONE, OTP, PASSWORD, EMAIL, PERSON, LOCATION]
    never_share: [CARD, OTP, PASSWORD]
    warning: "Never share card numbers, OTPs or passwords, even with bank staff."
    context_window: 30         # chars before a number searched for its context words
    context_words:
      NP_PAN: [pan]
      ACCOUNT_NO: [account, a/c, acct]
      OTP: [otp, code, pin]
      PASSWORD: [password, passcode, pw]
  injection:
    classifier: stub           # stub | deberta | prompt_guard (both need the `ml` extra)
    models:                    # kind -> HF model + the label that means "attack"
      deberta: {name: protectai/deberta-v3-base-prompt-injection-v2, positive_label: INJECTION}
      prompt_guard: {name: meta-llama/Llama-Prompt-Guard-2-86M, positive_label: LABEL_1}  # gated: needs HF_TOKEN
    max_length: 512            # longer inputs are truncated
    device: auto               # auto (cuda if available) | cpu | cuda
    tau: 0.8                   # block when max(pattern weight, classifier score) >= tau
    refusal: "Sorry, I can't help with that request. I can answer questions about Sagarmatha Digital Bank services."
    # name -> {regex, weight}; matched case-insensitively, multiline. Order = priority on equal weight.
    patterns:
      IGNORE_INSTRUCTIONS:
        regex: '\b(?:ignore|disregard|forget)\s+(?:(?:all|the|your|any|of)\s+)*(?:previous|prior|above|earlier)\s+(?:instructions|rules|prompts?|directions)\b'
        weight: 1.0
      ROLE_OVERRIDE:
        regex: '\byou\s+are\s+now\b|\bact\s+as\s+(?:dan\b|an?\s+(?:unrestricted|unfiltered|jailbroken)\b)|\b(?:developer|god|jailbreak)\s+mode\b'
        weight: 1.0
      PROMPT_EXTRACTION:
        regex: '\b(?:reveal|print|repeat|show|output|display|tell\s+me)\s+(?:me\s+)?(?:your|the)\s+(?:system\s+prompt|instructions|internal\s+reference|hidden\s+prompt|initial\s+prompt)\b'
        weight: 1.0
      FAKE_DELIMITER:
        regex: '<\s*/?\s*system\s*>|\[/?INST\]|<\|im_(?:start|end)\|>|^\s*#{2,}\s*system\s*:'
        weight: 1.0
      CANARY_PROBE:
        regex: 'GB-CANARY-|\bcanary\b'
        weight: 1.0

  topics:
    classifier: stub           # stub | embed_logreg (`ml` extra)
    embed_logreg:
      embedding_model: BAAI/bge-small-en-v1.5
      train_path: data/topics/train.yaml   # synthetic; trained at start-up
      C: 50.0                  # inverse regularisation; C=4 gave too-soft probabilities (crisis paraphrase 0.71)
      device: auto
    tau: 0.7                   # use the classifier label only when its probability >= tau
    helpline:
      name: National Suicide Prevention Helpline
      number: "1166"           # verified 2026-11-26; hours unconfirmed, so replies state none
      source: https://www.who.int/southeastasia/news/feature-stories/detail/nepal-suicide-prevention-helpline
    # Crisis fast-path: any hit routes to CRISIS before anything else. Case-insensitive.
    crisis:
      - '\b(?:want|going|wanna|ready)\s+to\s+end\s+it\b'
      - '\bend\s+it\s+all\b'
      - '\bend\s+my\s+life\b'
      - '\bkill\s+myself\b'
      - '\bsuicid\w*'
      - '\b(?:want|wish)\s+(?:to|i\s+could)\s+die\b'
      - '\bno\s+reason\s+to\s+live\b'
      - '\b(?:harm|hurt)\s+myself\b'
    # Keyword rules; YAML order = priority.
    categories:
      FRAUD_INTENT:
        - '\b(?:fake|forged|false|someone\s+else''?s)\s+(?:citizenship|passport|id|documents?|kyc|licen[cs]e|pan)\b'
        - '\blaunder\w*'
        - '\bmoney\s+mul(?:e|ing)\b'
        - '\bbypass\s+(?:the\s+)?kyc\b'
        - '\bhow\s+(?:do|can)\s+i\s+(?:scam|cheat|defraud|steal)\b'
      SCAM_VICTIM:
        - '\b(?:gave|shared|told)\s+(?:(?:them|him|her|someone|the\s+caller)\s+)?(?:my\s+)?(?:otp|pin|password|card\s+(?:number|details))\b'
        - '\bscam(?:med)?\b'
        - '\b(?:i\s+was|i''ve\s+been|got)\s+(?:defrauded|cheated|hacked|phished)\b'
        - '\bunauthori[sz]ed\s+(?:transaction|transfer|payment|debit)s?\b'
      COMPLAINT:
        - '\bcharged\s+(?:me\s+)?(?:twice|double|wrongly|extra)\b'
        - '\bdouble[-\s]charged\b'
        - '\b(?:complain|complaint|grievance|dispute)\w*'
        - '\b(?:rude|terrible|worst)\s+(?:service|staff|branch)\b'
      ADVICE:
        - '\bshould\s+i\s+(?:invest|put|buy|sell)\b'
        - '\bnepse\b'
        - '\bwhich\s+(?:shares?|stocks?)\b'
        - '\b(?:legal|tax)\s+advice\b'
        - '\bcan\s+i\s+sue\b'
      OFF_TOPIC:
        - '\b(?:write|compose)\s+(?:me\s+)?an?\s+(?:poem|song|story|essay)\b'
        - '\btell\s+me\s+a\s+joke\b'
        - '\brecipe\b'
        - '\bhomework\b'
    # Routing table (SPEC §3). action: allow | route | block. {helpline_name}/{helpline_number} are filled in.
    routes:
      CRISIS:
        action: route
        route: crisis
        escalate: true
        response: "I'm really sorry you're going through this, and you don't have to face it alone. Please call the {helpline_name} on {helpline_number} to talk with a trained counsellor. If you are in immediate danger, please contact local emergency services. I can also connect you with one of our staff right now: would you like me to put you through to a human agent? If loan repayments are part of the worry, our team can talk you through repayment relief options."
      FRAUD_INTENT:
        action: block
        route: block
        escalate: false
        response: "Sorry, I can't help with that request. I can answer questions about Sagarmatha Digital Bank services."
      SCAM_VICTIM: {action: route, route: answer, escalate: true}
      COMPLAINT: {action: route, route: answer, escalate: true}
      ADVICE:
        action: route
        route: answer
        escalate: false
        disclaimer: "This is general information from our published policies, not a personal investment, legal or tax recommendation. For advice on your own situation, please speak to a licensed adviser."
      OFF_TOPIC:
        action: route
        route: redirect
        escalate: false
        response: "I can only help with Sagarmatha Digital Bank questions, such as accounts, cards, loans and transfers. What would you like to know about your banking?"
      NORMAL: {action: allow, route: answer, escalate: false}

output:
  schema:
    strip_code_fence: true   # accept one ```json ... ``` wrapper around the object
  groundedness:
    scorer: keyword            # keyword | hhem (model arrives in feat/ml-output)
    tau_g: 0.6                 # claim supported when score >= tau_g (and no number missing); tune on dev
    number_check: true         # every number, %, amount and date in a claim must be in the cited chunks
    fallback_below: 0.5        # SPEC §4: support < 0.5 -> safe fallback; else regenerate
  leakage:
    canary_prefix: "GB-CANARY-"  # any value with this prefix in an answer is a leak, not just this session's
    tau_prompt: 0.75           # block when an answer sentence is this similar to a system-prompt sentence
                               # (hashing embedder: clean corpus max 0.63, verbatim prompt lines 0.87-1.0)
    keep_last: 4               # user's own PII echoed back keeps only its last 4 characters
    full_hide: [CARD, OTP, PASSWORD]   # own PII of these labels is never shown, even partially

# Invalid-response policy (SPEC §4), applied by remediation.py / pipeline.py.
remediation:
  max_schema_retries: 2        # schema-invalid reply: regenerate with the error, at most this many times
  regenerate_instruction: "Answer only from the CONTEXT. Remove any statement the context does not support, and reply with the JSON object only."
  strip_note: "I couldn't verify the rest, please confirm with a branch."
  fallback_text: "I'm sorry, I couldn't find a reliable answer to that. A member of our team will follow up, or you can visit any branch."
  block_text: "Sorry, I can't help with that request. I can answer questions about Sagarmatha Digital Bank services."
