# Every threshold, model name and routing rule lives here (CLAUDE.md rule).
# Env vars override llm.provider / llm.model / llm.region: HOSTED_PROVIDER, HOSTED_MODEL, BEDROCK_REGION.

llm:
  provider: mock                         # mock | bedrock
  model: us.anthropic.claude-opus-4-6-v1
  region: us-east-1
  max_tokens: 2048
  timeout_s: 60
  max_retries: 2
  structured_output: true             # output_config.format with the SupportReply JSON schema

retriever:
  top_k: 4
  embedder: hashing                      # hashing (fast, CI) | sentence-transformers
  embedding_model: BAAI/bge-small-en-v1.5
  hashing_dim: 4096

corpus:
  path: data/corpus

audit:
  path: logs/audit.jsonl

# Guardrail sections are filled in by the feature branches that implement them.
input:
  normalizer:
    decode:
      min_len: 16          # shortest base64/hex token considered for decoding
      min_printable: 0.9   # fraction of decoded chars that must be printable
    homoglyphs:            # look-alike -> Latin (Cyrillic, Greek)
      "а": "a"
      "в": "b"
      "е": "e"
      "к": "k"
      "м": "m"
      "н": "h"
      "о": "o"
      "р": "p"
      "с": "c"
      "т": "t"
      "у": "y"
      "х": "x"
      "і": "i"
      "ј": "j"
      "ѕ": "s"
      "А": "A"
      "В": "B"
      "Е": "E"
      "К": "K"
      "М": "M"
      "Н": "H"
      "О": "O"
      "Р": "P"
      "С": "C"
      "Т": "T"
      "Х": "X"
      "І": "I"
      "α": "a"
      "ε": "e"
      "ι": "i"
      "ο": "o"
      "ρ": "p"
      "υ": "u"
      "Α": "A"
      "Β": "B"
      "Ε": "E"
      "Ι": "I"
      "Κ": "K"
      "Μ": "M"
      "Ν": "N"
      "Ο": "O"
      "Ρ": "P"
      "Τ": "T"
      "Χ": "X"
  pii:
    backend: stub              # stub | presidio (needs the `pii` extra)
    spacy_model: en_core_web_sm
    # Order = priority when two equal-length spans overlap.
    labels: [CARD, NP_CITIZENSHIP, NP_PAN, ACCOUNT_NO, NP_PHONE, OTP, PASSWORD, EMAIL, PERSON, LOCATION]
    never_share: [CARD, OTP, PASSWORD]
    warning: "Never share card numbers, OTPs or passwords, even with bank staff."
    context_window: 30         # chars before a number searched for its context words
    context_words:
      NP_PAN: [pan]
      ACCOUNT_NO: [account, a/c, acct]
      OTP: [otp, code, pin]
      PASSWORD: [password, passcode, pw]

output: {}
