# End-to-end guardrail cases (SPEC §5, docs/specs/e2e-cases.md). Synthetic data only.
# Stage names are SPEC-dotted; `expected.action` is checked on the first result of that stage.
# llm_output templates: {grounded} = MockLLM grounded answer, {cite} = first kept chunk id,
# {canary} = this request's canary. A real miss gets `known_failure` (strict xfail), never an
# edited expectation.

