[project]
name = "guardbank"
version = "0.1.0"
description = "Input and output guardrails for a fictional bank's RAG support assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Royas Shakya" }]
dependencies = [
    # <2: SDK 2.x sends API version 2026-10-21, which Bedrock rejects for Opus 4.6.
    "anthropic[bedrock]>=0.60,<2",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real ML models (downloads weights)",
    "live: calls the hosted LLM (Bedrock); needs credentials in .env",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510"]
